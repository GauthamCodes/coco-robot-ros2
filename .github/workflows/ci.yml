name: CI

on:
  push:
    branches: [ main, develop, jazzy-harmonic-port, 'coco-2.1-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-xacro \
            ros-jazzy-ros2-controllers \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-moveit \
            ros-jazzy-navigation2 \
            ros-jazzy-nav2-bringup \
            ros-jazzy-vision-msgs \
            ros-jazzy-tf2-geometry-msgs \
            ros-jazzy-diagnostic-msgs \
            ros-jazzy-cv-bridge \
            python3-pytest \
            python3-yaml \
            python3-opencv \
            python3-numpy \
            python3-scipy \
            python3-tornado \
            nodejs \
            liburdfdom-tools
          # coco_rl's tests guard their imports with pytest.importorskip, so
          # without gymnasium they would skip silently and CI would report
          # green having run none of them. Torch/SB3 are not needed: the
          # tests cover the pure reward and env-helper maths, not training.
          # cv_bridge and opencv are the same trap for coco_perception:
          # target_finder imports both at module scope, so without them its
          # whole suite would vanish behind a collection error.
          pip install --break-system-packages gymnasium mujoco==3.11.0

      - name: Evaluation control-plane unit tests
        run: python3 -m pytest -q eval/tests

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select gazebo_models custom_teleop coco_config coco_moveit_config coco_web coco_rl coco_perception coco_mission coco_sim

      - name: Evaluation namespace isolation launch test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest -q eval/ros_tests

      - name: Validate robot model
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xacro install/gazebo_models/share/gazebo_models/urdf/coco_robo2.xacro > /tmp/coco.urdf
          check_urdf /tmp/coco.urdf

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select gazebo_models custom_teleop coco_config coco_moveit_config coco_rl coco_perception coco_mission coco_sim coco_web
          colcon test-result --verbose
          # colcon test exits 0 even when a package collected nothing, which
          # is exactly how the coco_rl suite went unnoticed: its tests use
          # pytest.importorskip, so a missing gymnasium made them vanish
          # while CI stayed green. Fail if the count drops below what the
          # tree actually has. ament_python writes pytest.xml, ament_cmake
          # writes *.xunit.xml -- both are needed.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(set(glob.glob('build/**/pytest.xml', recursive=True)
                             + glob.glob('build/**/*.xunit.xml', recursive=True)))
          total = failures = 0
          for f in files:
              root = ET.parse(f).getroot()
              for s in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  total += int(s.get('tests', 0))
                  failures += int(s.get('failures', 0)) + int(s.get('errors', 0))
          print(f'collected {total} tests across {len(files)} suites, '
                f'{failures} failed/errored')
          if failures:
              sys.exit(1)
          # Each package must produce a non-empty suite. A global floor
          # can hide the loss of a small package behind growth elsewhere.
          packages = ('gazebo_models', 'custom_teleop', 'coco_config',
                      'coco_moveit_config', 'coco_rl', 'coco_perception',
                      'coco_mission', 'coco_sim', 'coco_web')
          for package in packages:
              suites = [f for f in files if f.startswith(f'build/{package}/')]
              count = 0
              for f in suites:
                  root = ET.parse(f).getroot()
                  count += sum(int(s.get('tests', 0)) for s in
                               ([root] if root.tag == 'testsuite' else root.iter('testsuite')))
              if count == 0:
                  sys.exit(f'{package}: no tests collected')
          PY
